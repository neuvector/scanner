name: Install cosign
inputs:
  version:
    default: v3.1.4
  checksum_linux_x86_64:
    default: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  checksum_linux_arm64:
    default: ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        COSIGN_VERSION: ${{ inputs.version }}
        CHECKSUM_X86_64: ${{ inputs.checksum_linux_x86_64 }}
        CHECKSUM_ARM64: ${{ inputs.checksum_linux_arm64 }}
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64|amd64)
            binary="cosign-linux-amd64"
            checksum="${CHECKSUM_X86_64}"
            ;;
          aarch64|arm64)
            binary="cosign-linux-arm64"
            checksum="${CHECKSUM_ARM64}"
            ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        curl -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${binary}" -o cosign
        echo "${checksum}  cosign" | sha256sum -c
        chmod +x cosign
        sudo mv cosign /usr/local/bin/cosign
